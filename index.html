<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة أزادير - منظومة PVC المقاسات والأعواد</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 950px; margin: auto; background: #fff; border: 2px solid #2c3e50; border-radius: 8px; padding: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 3px double #2c3e50; padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { margin: 0; color: #1a252f; font-size: 26px; }
        .header h3 { margin: 5px 0 0; color: #7f8c8d; font-size: 16px; }
        .phone { font-weight: bold; color: #27ae60; font-size: 18px; margin-top: 5px; }
        
        .form-section { background: #f8f9fa; border: 1px solid #dcdfe6; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
        .row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 140px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        
        .btn-add { background: #27ae60; color: white; border: none; padding: 10px 15px; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 5px; }
        .btn-add:hover { background: #219150; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #bdc3c7; padding: 8px; text-align: center; font-size: 14px; }
        th { background: #34495e; color: white; }
        .btn-del { background: #c0392b; color: white; border: none; padding: 4px 8px; border-radius: 3px; cursor: pointer; }

        .result-box { margin-top: 25px; background: #fff; border: 2px solid #2980b9; padding: 15px; border-radius: 6px; }
        .result-title { font-weight: bold; font-size: 18px; color: #2c3e50; border-bottom: 2px solid #2980b9; padding-bottom: 8px; margin-bottom: 12px; }
        
        .whatsapp-btn { display: inline-block; width: 100%; text-align: center; background: #25D366; color: white; padding: 14px; font-size: 18px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; margin-top: 15px; box-sizing: border-box; }
        .whatsapp-btn:hover { background: #1ebd56; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>شركة أزادير (Azadir)</h1>
        <h3>فرع القوارشة - قسم PVC (حساب الفاتورة والأعواد)</h3>
        <div class="phone">هاتف / واتساب: 0945110070</div>
    </div>

    <!-- إعداد العود -->
    <div class="form-section">
        <div class="row">
            <div class="col">
                <label>طول العود المعتمد (متر):</label>
                <select id="barLength">
                    <option value="5.80">5.80 متر</option>
                    <option value="6.50">6.50 متر</option>
                </select>
            </div>
        </div>
    </div>

    <!-- إدخال الأبواب والشبابيك -->
    <div class="form-section">
        <h4 style="margin-top:0;">إضافة عنصر للفاتورة</h4>
        <div class="row">
            <div class="col">
                <label>النوع:</label>
                <select id="itemType" onchange="toggleSystemOptions()">
                    <option value="window">شباك</option>
                    <option value="door">باب</option>
                </select>
            </div>
            <div class="col" id="systemCol">
                <label>نظام الفتح:</label>
                <select id="itemSystem">
                    <option value="casement1">مفصلي (ضلفة واحدة)</option>
                    <option value="casement2">مفصلي (ضلفتين)</option>
                    <option value="sliding">سحاب</option>
                </select>
            </div>
            <div class="col">
                <label>العرض (سم):</label>
                <input type="number" id="itemWidth" placeholder="100">
            </div>
            <div class="col">
                <label>الارتفاع (سم):</label>
                <input type="number" id="itemHeight" placeholder="100">
            </div>
            <div class="col">
                <label>العدد:</label>
                <input type="number" id="itemQty" value="1" min="1">
            </div>
        </div>
        <button class="btn-add" onclick="addItem()">+ إضافة القائمة للفاتورة</button>
    </div>

    <!-- جدول البنود المدخلة -->
    <table>
        <thead>
            <tr>
                <th>النوع</th>
                <th>النظام</th>
                <th>المقاس (سم)</th>
                <th>العدد</th>
                <th>إجراء</th>
            </tr>
        </thead>
        <tbody id="itemsTable">
            <!-- البنود المضافة تظهر هنا -->
        </tbody>
    </table>

    <button style="width:100%; background:#2c3e50; color:#fff; border:none; padding:12px; font-size:16px; font-weight:bold; margin-top:15px; border-radius:4px; cursor:pointer;" onclick="calculateInvoice()">حساب الفاتورة وإخراج المواد</button>

    <!-- المخرجات النهائية -->
    <div class="result-box" id="resultBox" style="display:none;">
        <div class="result-title">فاتورة المواد والاكسسوارات المطلوبة</div>
        <div id="resultOutput" style="white-space: pre-wrap; font-family: monospace; font-size: 15px;"></div>
        <a id="whatsappLink" href="#" target="_blank" class="whatsapp-btn">إرسال الفاتورة عبر واتساب</a>
    </div>
</div>

<script>
    let invoiceItems = [];

    function toggleSystemOptions() {
        const type = document.getElementById('itemType').value;
        const systemCol = document.getElementById('systemCol');
        if (type === 'door') {
            systemCol.style.display = 'none';
        } else {
            systemCol.style.display = 'block';
        }
    }

    function addItem() {
        const type = document.getElementById('itemType').value;
        const system = type === 'door' ? 'door' : document.getElementById('itemSystem').value;
        const w = parseFloat(document.getElementById('itemWidth').value);
        const h = parseFloat(document.getElementById('itemHeight').value);
        const qty = parseInt(document.getElementById('itemQty').value);

        if (!w || !h || !qty) {
            alert("الرجاء إدخال المقاس والعدد بشكل صحيح");
            return;
        }

        invoiceItems.push({ type, system, w, h, qty });
        updateTable();
        
        document.getElementById('itemWidth').value = '';
        document.getElementById('itemHeight').value = '';
        document.getElementById('itemQty').value = '1';
    }

    function updateTable() {
        const tbody = document.getElementById('itemsTable');
        tbody.innerHTML = '';
        
        invoiceItems.forEach((item, index) => {
            let sysText = item.type === 'door' ? 'باب' : 
                         item.system === 'casement1' ? 'مفصلي ضلفة' : 
                         item.system === 'casement2' ? 'مفصلي ضلفتين' : 'سحاب';
            
            tbody.innerHTML += `
                <tr>
                    <td>${item.type === 'window' ? 'شباك' : 'باب'}</td>
                    <td>${sysText}</td>
                    <td>${item.w} × ${item.h}</td>
                    <td>${item.qty}</td>
                    <td><button class="btn-del" onclick="removeItem(${index})">حذف</button></td>
                </tr>
            `;
        });
    }

    function removeItem(index) {
        invoiceItems.splice(index, 1);
        updateTable();
    }

    function calculateInvoice() {
        if (invoiceItems.length === 0) {
            alert("الرجاء إضافة عناصر للفاتورة أولاً");
            return;
        }

        const barLen = parseFloat(document.getElementById('barLength').value);

        // تجميع الأطوال بالأمتار
        let totalFrameMeters = 0;       // حلق
        let totalWinMeters = 0;         // شباك
        let totalDoorMeters = 0;        // باب
        let totalTMeters = 0;           // تي وجهين
        let totalPackitaNormMeters = 0; // باكيتا عادية
        let totalPackitaDoubleMeters = 0; // باكيتا دبل
        let totalRetiMeters = 0;        // عظمة ريتي

        // أعداد العناصر والإكسسوارات
        let countWindows = 0;
        let countDoors = 0;
        let lockFull = 0;
        let doorHinges = 0;
        let winHinges = 0;
        let winHandles = 0;
        let retiSeats = 0;   // طقم كرسي
        let retiCarriers = 0; // شيال

        invoiceItems.forEach(item => {
            const wM = item.w / 100;
            const hM = item.h / 100;
            const qty = item.qty;

            // الحلق دائماً محيط الفتحة
            let frame = (wM + hM) * 2 * qty;
            totalFrameMeters += frame;

            if (item.type === 'door') {
                countDoors += qty;
                // عود الباب
                let doorSash = (wM + hM) * 2 * qty;
                totalDoorMeters += doorSash;
                // باكيتا دبل للأبواب
                totalPackitaDoubleMeters += frame * 2; // وجهين
                // اكسسوارات الباب
                lockFull += 1 * qty;
                doorHinges += 4 * qty;
            } else {
                countWindows += qty;
                // باكيتا عادية للشبابيك
                totalPackitaNormMeters += frame * 2;

                if (item.system === 'casement1') {
                    // ضلفة واحدة
                    let winSash = (wM + hM) * 2 * qty;
                    totalWinMeters += winSash;
                    // عظمة ريتي (نفس طول عود الضلفة تقريباً)
                    totalRetiMeters += winSash;
                    
                    winHandles += 1 * qty;
                    winHinges += 3 * qty;
                    retiSeats += 1 * qty;
                    retiCarriers += 1 * qty;
                } else if (item.system === 'casement2') {
                    // ضلفتين
                    let winSash = ((wM/2 + hM) * 2 * 2) * qty; // ضلفتين
                    totalWinMeters += winSash;
                    
                    // T وجهين بالمنتصف ارتفاع واحد لكل شباك
                    totalTMeters += hM * qty;
                    
                    // عظمة ريتي للضلفتين
                    totalRetiMeters += winSash;

                    winHandles += 2 * qty;
                    winHinges += 6 * qty;
                    retiSeats += 2 * qty;
                    retiCarriers += 2 * qty;
                } else if (item.system === 'sliding') {
                    let winSash = (wM + hM) * 2 * qty;
                    totalWinMeters += winSash;
                }
            }
        });

        // تحويل الأطوال إلى أعواد
        let barsFrame = Math.ceil(totalFrameMeters / barLen);
        let barsWin = Math.ceil(totalWinMeters / barLen);
        let barsDoor = Math.ceil(totalDoorMeters / barLen);
        let barsT = Math.ceil(totalTMeters / barLen);
        let barsPackitaNorm = Math.ceil(totalPackitaNormMeters / barLen);
        let barsPackitaDouble = Math.ceil(totalPackitaDoubleMeters / barLen);
        let barsReti = Math.ceil(totalRetiMeters / barLen);

        // كتابة نص الفاتورة (أصناف وأعداد فقط)
        let output = `شركة أزادير (Azadir) - فرع القوارشة\n`;
        output += `فاتورة طلب مواد PVC (طول العود: ${barLen} متر)\n`;
        output += `------------------------------------\n`;
        output += `إجمالي عدد الشبابيك: ${countWindows}\n`;
        output += `إجمالي عدد الأبواب: ${countDoors}\n`;
        output += `------------------------------------\n`;
        output += `الأعواد المطلوبة:\n`;
        if (barsFrame > 0) output += `- عود حلق: ${barsFrame}\n`;
        if (barsWin > 0) output += `- عود شباك: ${barsWin}\n`;
        if (barsDoor > 0) output += `- عود باب: ${barsDoor}\n`;
        if (barsT > 0) output += `- عود تي وجهين: ${barsT}\n`;
        if (barsPackitaNorm > 0) output += `- عود باكيتا عادية: ${barsPackitaNorm}\n`;
        if (barsPackitaDouble > 0) output += `- عود باكيتا دبل: ${barsPackitaDouble}\n`;
        if (barsReti > 0) output += `- عود عظمة ريتي: ${barsReti}\n`;

        output += `------------------------------------\n`;
        output += `الإكسسوارات المطلوبة:\n`;
        if (lockFull > 0) output += `- قفل باب كامل: ${lockFull}\n`;
        if (doorHinges > 0) output += `- مفصلات باب: ${doorHinges}\n`;
        if (winHandles > 0) output += `- يد شباك: ${winHandles}\n`;
        if (winHinges > 0) output += `- مفصلات شباك: ${winHinges}\n`;
        if (retiSeats > 0) output += `- طقم كرسي ريتي: ${retiSeats}\n`;
        if (retiCarriers > 0) output += `- شيال ريتي: ${retiCarriers}\n`;

        document.getElementById('resultOutput').innerText = output;
        document.getElementById('resultBox').style.display = 'block';

        const encodedText = encodeURIComponent(output);
        document.getElementById('whatsappLink').href = `https://wa.me/218945110070?text=${encodedText}`;
    }
</script>

</body>
</html>
